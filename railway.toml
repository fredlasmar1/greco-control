[build]
builder = "nixpacks"
# BUILD_VERSION atualizada em 2026-04-24 14:55 -03 para forçar rebuild após refactor estoque-vendas-v3
buildCommand = "npm install --legacy-peer-deps && rm -rf dist && npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/trinks/status"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
